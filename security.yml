---
# Improve security.
# Configure the Raspberry Pi to require key-based authentication for ssh.
# Enable automatic upgrades.
# https://www.raspberrypi.org/documentation/configuration/security.md
# https://wiki.debian.org/UnattendedUpgrades

- hosts: "{{ ansible_limit | default('raspi') }}"
  gather_facts: no

  tasks:
    - name: Add authorized keys
      authorized_key:
        user: "{{ ansible_user }}"
        key: "{{ lookup('file', item) }}"
      with_fileglob:
        - "{{ lookup('env','HOME') }}/.ssh/*.pub"
        - "files/*.pub"

    - name: Verify key-based authentication
      command: ssh -o PasswordAuthentication=no {{ ansible_user }}@{{ inventory_hostname }} true
      delegate_to: localhost
      changed_when: no

    - name: Prohibit password logins
      become: yes
      copy:
        src: files/00-prohibit-password.conf
        dest: /etc/sshd_config.d/
        mode: 0600

    - name: Disable warnings for 'pi' user
      become: yes
      apt:
        update-cache: yes
        cache_valid_time: 3600
        pkg:
          - userconf-pi
          - libpam-chksshpwd
        state: absent
        purge: yes

    - name: Enable automatic updates
      become: yes
      apt:
        update-cache: yes
        cache_valid_time: 3600
        pkg:
          - unattended-upgrades

...
